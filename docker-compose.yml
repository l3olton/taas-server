services:
  database:
    image: 'postgres:17'
    ports:
      - 5432:5432
    env_file:
      - .env
    networks:
      - postgres-network
  
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 5433:80
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - postgres-network
    volumes:
      - ${PWD}/pgadmin-data/:/var/lib/pgadmin/

networks: 
  postgres-network:
    driver: bridge
